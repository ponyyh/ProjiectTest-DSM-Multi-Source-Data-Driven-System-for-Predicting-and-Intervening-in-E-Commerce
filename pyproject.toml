[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-prediction"
version = "1.0.0"
description = "E-commerce customer churn prediction and intervention system"
requires-python = ">=3.9"
dependencies = [
  "pandas>=2.0", "numpy>=1.24", "scikit-learn>=1.3", "joblib>=1.3",
  "pyyaml>=6.0", "matplotlib>=3.7", "seaborn>=0.12", "fastapi>=0.100",
  "uvicorn[standard]>=0.23", "pydantic>=2.0", "streamlit>=1.28"
]

[project.optional-dependencies]
xgboost = ["xgboost>=2.0"]
shap = ["shap>=0.43"]
dev = ["pytest>=7.4", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
